name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consistencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        # Fonte única: requirements.txt, com versões fixadas (a mesma lista do
        # `make install`). numpy/scipy/statsmodels NÃO são opcionais: os testes
        # os usam como oráculo de referência.
        run: pip install -r requirements.txt
      - name: Testes (recalculam os resultados centrais) + consistência relatório↔script
        run: python -m pytest tests/ -q -rs
      - name: Nenhum teste pode ser pulado
        # -q esconde skips. Um skip aqui significa que um gate sumiu; falhar é
        # mais honesto do que um build verde que não validou nada.
        run: |
          SKIPS=$(python -m pytest tests/ -q -rs 2>&1 | grep -c '^SKIPPED' || true)
          if [ "$SKIPS" -ne 0 ]; then
            echo "::error::$SKIPS teste(s) pulado(s) — gate não executou"; exit 1
          fi
